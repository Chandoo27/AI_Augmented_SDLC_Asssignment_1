name: Assignment validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  part-1a:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Part 1A and development dependencies
        working-directory: PART-1A
        run: python -m pip install -e ".[dev]"
      - name: Run the Part 1A harness
        working-directory: PART-1A
        run: python scripts/run_harness.py
      - name: Preserve harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-1a-harness-${{ matrix.python-version }}
          path: PART-1A/evidence/harness-runs/
          if-no-files-found: ignore

  part-1b:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Part 1B and development dependencies
        working-directory: PART-1B
        run: python -m pip install -e ".[dev]"
      - name: Run Part 1B formatting check
        working-directory: PART-1B
        run: python -m ruff format --check src tests
      - name: Run Part 1B lint
        working-directory: PART-1B
        run: python -m ruff check .
      - name: Run Part 1B type check
        working-directory: PART-1B
        run: python -m mypy src/reminder_agent
      - name: Run offline Part 1B tests and core coverage gate
        working-directory: PART-1B
        run: python -m pytest --cov --cov-branch --cov-report=term-missing
      - name: Run Part 1B security checks
        working-directory: PART-1B
        run: |
          python -m bandit -q -r src/reminder_agent
          detect-secrets scan -n | python -c "import json,sys; sys.exit(bool(json.load(sys.stdin).get('results')))"
          python -m pip_audit
