[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-reminder-agent"
version = "0.1.0"
description = "A Gemini-backed natural-language reminder agent"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1,<2",
    "httpx>=0.27,<1",
    "jsonschema[format-nongpl]>=4.23,<5",
    "python-dotenv>=1,<2",
    "tzdata>=2024.1",
]

[project.scripts]
reminder-agent = "reminder_agent.cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2",
    "detect-secrets>=1.5,<2",
    "hypothesis>=6.100,<7",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true
